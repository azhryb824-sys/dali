name: Apply annual contract save fix

on:
  push:
    branches:
      - godaddy-preview
    paths:
      - scripts/apply-contract-save-fix.py
      - .github/workflows/apply-contract-save-fix.yml

permissions:
  contents: write

concurrency:
  group: annual-contract-save-fix
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AUTH_MODE: credentials
      DATABASE_URL: file:/tmp/dali-ci.db
      UPLOADS_DIR: /tmp/dali-ci-uploads
      AUTH_SECRET: ci-auth-secret-for-dali-with-more-than-32-characters
      PORTAL_ADMIN_IDENTIFIER: "1234567890"
      PORTAL_ADMIN_EMAIL: admin@example.test
      PORTAL_ADMIN_EMAILS: admin@example.test
      PORTAL_ADMIN_NAME: CI Administrator
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
        with:
          ref: godaddy-preview
          fetch-depth: 0

      - name: Make patcher support compact client files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply-contract-save-fix.py")
          source = path.read_text(encoding="utf-8")
          old = '''    if 'from "@/lib/client-api"' not in source:
                  source = replace_once(source, '\"use client\";\\n', '\"use client\";\\n\\nimport { readApiJson } from \"@/lib/client-api\";\\n', f"client api import {relative}")
          '''
          new = '''    if 'from "@/lib/client-api"' not in source:
                  directive = '\"use client\";'
                  position = source.find(directive)
                  if position < 0:
                      raise RuntimeError(f"client api import {relative}: client directive not found")
                  insert_at = position + len(directive)
                  source = source[:insert_at] + '\\n\\nimport { readApiJson } from \"@/lib/client-api\";\\n' + source[insert_at:]
          '''
          if old not in source:
              raise SystemExit("target patcher block was not found")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Apply focused source patch
        run: python3 scripts/apply-contract-save-fix.py

      - name: Make wizard validation DOM-type safe
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("app/portal/PortalDashboard.tsx")
          source = path.read_text(encoding="utf-8")
          old = '''    const requiredFields = form ? Array.from(form.querySelectorAll<HTMLInputElement | HTMLSelectElement | HTMLTextAreaElement>("input[required], select[required], textarea[required]")).filter((field) => field.type !== "hidden" && field.offsetParent !== null) : [];
          '''
          new = '''    const requiredFields = form ? Array.from(form.querySelectorAll("input[required], select[required], textarea[required]")).filter((field) => field instanceof HTMLElement && (!(field instanceof HTMLInputElement) || field.type !== "hidden") && field.offsetParent !== null) as Array<HTMLInputElement | HTMLSelectElement | HTMLTextAreaElement> : [];
          '''
          if old not in source:
              raise SystemExit("wizard validation line was not found")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate test administrator password hash
        run: echo "PORTAL_ADMIN_PASSWORD_HASH=$(node scripts/hash-password.mjs 'ci-test-password-2026!')" >> "$GITHUB_ENV"

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Build and regression tests
        run: npm test

      - name: Commit verified source changes
        run: |
          git config user.name "dali-verification-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app lib tests
          git diff --cached --quiet && exit 0
          git commit -m "fix: annual contract schedule and save reliability"
          git push origin HEAD:godaddy-preview
