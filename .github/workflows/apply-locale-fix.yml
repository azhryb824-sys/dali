name: Verify locale hotfix
on:
  push:
    branches: [codex/language-switch-fix-20260921]
    paths: [.github/workflows/apply-locale-fix.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTH_MODE: credentials
      DATABASE_URL: file:/tmp/dali-ci.db
      UPLOADS_DIR: /tmp/dali-ci-uploads
      AUTH_SECRET: ci-auth-secret-for-dali-with-more-than-32-characters
      PORTAL_ADMIN_IDENTIFIER: "1234567890"
      PORTAL_ADMIN_EMAIL: admin@example.test
      PORTAL_ADMIN_EMAILS: admin@example.test
      PORTAL_ADMIN_NAME: CI Administrator
      DALI_PLAYWRIGHT_MODULE: /tmp/dali-playwright/node_modules/playwright/index.mjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Apply verified source changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, lzma
          root = Path.cwd().resolve()
          parts = [(root / f'review-patches/locale/{i:02}.b64').read_text().strip() for i in range(1,3)]
          packed = base64.b64decode(''.join(parts), validate=True)
          assert hashlib.sha256(packed).hexdigest() == '31bc76b2f37bc00e2da2b73b3ff49e015e2c05a15ebeba9f5dffcc275c45433e', 'Transfer checksum mismatch'
          pending = []
          for item in json.loads(lzma.decompress(packed)):
              path = (root / item['path']).resolve()
              assert path.is_relative_to(root) and '.git' not in path.relative_to(root).parts
              original = path.read_bytes() if path.exists() else b''
              if item['path'] == '.github/workflows/locale-browser.yml':
                  assert hashlib.sha256(original).hexdigest() == item['after'], 'Authorized workflow differs'
                  continue
              assert hashlib.sha256(original).hexdigest() == item['before'], f"Source changed: {item['path']}"
              lines = original.decode().splitlines(keepends=True)
              for start, end, replacement in reversed(item['edits']):
                  lines[start:end] = replacement.splitlines(keepends=True)
              output = ''.join(lines).encode()
              assert hashlib.sha256(output).hexdigest() == item['after'], f"Output mismatch: {item['path']}"
              pending.append((path, output))
          for path, output in pending:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(output)
              print('Verified', path.relative_to(root))
          PY
      - run: npm ci
      - run: npm run i18n:generate
      - name: Commit implementation on review branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r review-patches/locale
          git rm .github/workflows/apply-locale-fix.yml
          git add app lib tests
          git diff --cached --check
          git commit -m 'Fix locale switching without reload, unsafe DOM translation or session disruption'
          git push origin HEAD:codex/language-switch-fix-20260921
          git rev-parse HEAD
      - name: Test-only administrator hash
        run: echo "PORTAL_ADMIN_PASSWORD_HASH=$(node scripts/hash-password.mjs 'ci-test-password-2026!')" >> "$GITHUB_ENV"
      - run: npm run typecheck
      - run: npm run lint
      - name: Production build and regression tests
        run: npm test
      - name: Install isolated browser test runner
        run: |
          npm install --prefix /tmp/dali-playwright playwright@1.56.1 --no-audit --no-fund
          /tmp/dali-playwright/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser language switching on actual dashboard with synthetic data
        run: node tests/browser/locale-runtime.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dali-language-browser-results
          path: /tmp/dali-locale-browser
          retention-days: 7
          if-no-files-found: ignore
