name: Contract workforce review
on:
  push:
    branches: [codex/contract-fields-workers-20260920]
    paths: [.github/workflows/contract-workforce-review.yml]
permissions:
  contents: read
jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package tracked source only
        run: git archive --format=tar.gz -o /tmp/dali-review-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: dali-review-source
          path: /tmp/dali-review-source.tar.gz
          retention-days: 1
