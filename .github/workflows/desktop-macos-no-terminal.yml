name: Build Dali macOS No-Terminal

on:
  workflow_dispatch:
  push:
    branches: [macos-no-terminal-0.2.5]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-macos-no-terminal.yml"

permissions:
  contents: read

jobs:
  mac-installer:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-14
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Validate desktop source
        run: npm run desktop:check
      - name: Build locally signed macOS package
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never
      - name: Verify application signature and packages
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find desktop/dist -maxdepth 2 -type d -name '*.app' -print -quit)"
          test -n "$app_path"
          /usr/bin/codesign --verify --deep --strict --verbose=4 "$app_path"
          /usr/bin/codesign -dv --verbose=4 "$app_path" 2>&1
          dmg_path="$(find desktop/dist -maxdepth 1 -type f -name 'Dali-Mac-No-Terminal-*-${{ matrix.arch }}.dmg' -print -quit)"
          zip_path="$(find desktop/dist -maxdepth 1 -type f -name 'Dali-Mac-No-Terminal-*-${{ matrix.arch }}.zip' -print -quit)"
          test -s "$dmg_path"
          test -s "$zip_path"
          hdiutil verify "$dmg_path"
          shasum -a 256 "$dmg_path" "$zip_path"
      - uses: actions/upload-artifact@v4
        with:
          name: Dali-Mac-No-Terminal-${{ matrix.arch }}
          path: |
            desktop/dist/Dali-Mac-No-Terminal-*-${{ matrix.arch }}.dmg
            desktop/dist/Dali-Mac-No-Terminal-*-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 7
