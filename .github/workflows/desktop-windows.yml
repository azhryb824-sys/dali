name: Build Dali Windows Desktop

on:
  workflow_dispatch:
  push:
    branches: [godaddy-preview]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-windows.yml"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Read desktop version
        id: desktop-version
        shell: pwsh
        run: |
          $version = node -p "require('./desktop/package.json').version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Create immutable release tag
        shell: pwsh
        run: |
          $version = "${{ steps.desktop-version.outputs.version }}"
          $tag = "v$version"
          git fetch --tags origin
          if (git tag --list $tag) { throw "Release tag $tag already exists; increase the desktop version." }
          git tag $tag $env:GITHUB_SHA
          git push origin $tag
      - name: Build single Windows installer
        working-directory: desktop
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Verify installer
        shell: pwsh
        run: |
          $version = "${{ steps.desktop-version.outputs.version }}"
          $installer = Get-Item "desktop/dist/Dali-Desktop-Setup-$version.exe"
          if ($installer.Length -lt 50000000) { throw "Installer is unexpectedly small" }
          Get-Item "desktop/dist/Dali-Desktop-Setup-$version.exe.blockmap" | Out-Null
          Get-Item "desktop/dist/latest.yml" | Out-Null
          Get-FileHash $installer.FullName -Algorithm SHA256
      - name: Publish one stable update release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.desktop-version.outputs.version }}"
          gh release create "v$version" `
            "desktop/dist/Dali-Desktop-Setup-$version.exe" `
            "desktop/dist/Dali-Desktop-Setup-$version.exe.blockmap" `
            "desktop/dist/latest.yml" `
            --verify-tag `
            --latest `
            --title "$version" `
            --notes "تحديث مستقر لتطبيق نظام دالي الإداري."
      - uses: actions/upload-artifact@v4
        with:
          name: Dali-Desktop-Setup-${{ steps.desktop-version.outputs.version }}
          path: |
            desktop/dist/Dali-Desktop-Setup-${{ steps.desktop-version.outputs.version }}.exe
            desktop/dist/latest.yml
            desktop/dist/*.blockmap
          if-no-files-found: error
          retention-days: 30
