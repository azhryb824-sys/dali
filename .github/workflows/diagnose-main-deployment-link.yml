name: Diagnose main deployment link

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-main-deployment-link.yml
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: read
  deployments: read
  statuses: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect main checks and deployment records
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          headers=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          curl --fail --silent --show-error "${headers[@]}" "${api}/branches/main" -o /tmp/branch.json
          main_sha="$(python -c 'import json; print(json.load(open("/tmp/branch.json"))["commit"]["sha"])')"
          echo "main_sha=${main_sha}"

          curl --fail --silent --show-error "${headers[@]}" "${api}/commits/${main_sha}/check-runs?per_page=100" -o /tmp/checks.json
          curl --fail --silent --show-error "${headers[@]}" "${api}/actions/runs?head_sha=${main_sha}&per_page=100" -o /tmp/runs.json
          curl --fail --silent --show-error "${headers[@]}" "${api}/commits/${main_sha}/status" -o /tmp/status.json
          curl --fail --silent --show-error "${headers[@]}" "${api}/deployments?sha=${main_sha}&per_page=100" -o /tmp/deployments.json

          python <<'PY'
          import json

          checks = json.load(open('/tmp/checks.json'))
          runs = json.load(open('/tmp/runs.json'))
          status = json.load(open('/tmp/status.json'))
          deployments = json.load(open('/tmp/deployments.json'))

          print(f"check_runs_total={checks.get('total_count', 0)}")
          for item in checks.get('check_runs', []):
              app = (item.get('app') or {}).get('slug') or (item.get('app') or {}).get('name') or ''
              print(
                  "check="
                  f"id={item.get('id', '')}|name={item.get('name', '')}|app={app}|status={item.get('status', '')}|"
                  f"conclusion={item.get('conclusion', '')}|started={item.get('started_at', '')}|"
                  f"completed={item.get('completed_at', '')}|details={item.get('details_url', '')}"
              )

          workflow_runs = runs.get('workflow_runs', [])
          print(f"workflow_runs_total={len(workflow_runs)}")
          for item in workflow_runs:
              print(
                  "workflow="
                  f"id={item.get('id', '')}|name={item.get('name', '')}|event={item.get('event', '')}|"
                  f"status={item.get('status', '')}|conclusion={item.get('conclusion', '')}|"
                  f"run_attempt={item.get('run_attempt', '')}|created={item.get('created_at', '')}|url={item.get('html_url', '')}"
              )

          print(f"combined_status={status.get('state', '')}")
          for item in status.get('statuses', []):
              print(f"status={item.get('context', '')}|state={item.get('state', '')}|created={item.get('created_at', '')}")

          print(f"deployments_total={len(deployments)}")
          for item in deployments:
              creator = (item.get('creator') or {}).get('login') or ''
              print(
                  "deployment="
                  f"id={item.get('id', '')}|environment={item.get('environment', '')}|task={item.get('task', '')}|"
                  f"creator={creator}|created={item.get('created_at', '')}"
              )
          PY
