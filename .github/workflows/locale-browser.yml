name: Verify language switching in browser
on:
  pull_request:
    paths:
      - app/components/LocaleRuntime.tsx
      - app/components/AppDialogProvider.tsx
      - app/portal/PortalDashboard.tsx
      - app/portal/error.tsx
      - lib/client-locale.ts
      - lib/locale-dom.ts
      - tests/browser/locale-*
      - .github/workflows/locale-browser.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - run: npm install --prefix /tmp/dali-playwright playwright@1.56.1 --no-audit --no-fund
      - run: /tmp/dali-playwright/node_modules/.bin/playwright install --with-deps chromium
      - run: node tests/browser/locale-runtime.mjs
        env:
          DALI_PLAYWRIGHT_MODULE: /tmp/dali-playwright/node_modules/playwright/index.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: locale-browser-verification
          path: /tmp/dali-locale-browser
          retention-days: 7
