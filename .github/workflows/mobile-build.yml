name: Mobile application

on:
  workflow_dispatch:
  push:
    branches:
      - "codex/mobile-app"
    paths:
      - "mobile/**"
      - "public/mobile/**"
      - "app/portal/layout.tsx"
      - "app/api/portal/desktop/sync/route.ts"
      - "proxy.ts"
      - "tests/mobile-app.test.mjs"
      - ".github/workflows/mobile-build.yml"
  pull_request:
    paths:
      - "mobile/**"
      - "public/mobile/**"
      - "app/portal/layout.tsx"
      - "app/api/portal/desktop/sync/route.ts"
      - "proxy.ts"
      - "tests/mobile-app.test.mjs"
      - ".github/workflows/mobile-build.yml"

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Mobile policy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --prefix mobile
      - run: npm run mobile:check

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    needs: policy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci --prefix mobile
      - run: npm run sync --prefix mobile
      - run: ./gradlew assembleDebug
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: dali-mobile-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS simulator build
    runs-on: macos-latest
    needs: policy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --prefix mobile
      - run: npm run sync --prefix mobile
      - name: Build without signing
        run: xcodebuild -project mobile/ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -derivedDataPath mobile/ios/DerivedData CODE_SIGNING_ALLOWED=NO build
