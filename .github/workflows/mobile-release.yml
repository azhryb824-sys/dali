name: Signed Android mobile release

on:
  workflow_dispatch:
  push:
    branches:
      - "codex/mobile-app"
    paths:
      - ".github/workflows/mobile-release.yml"
      - "mobile/**"

permissions:
  contents: read

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-release:
    name: Signed Android release APK and AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.DALI_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DALI_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DALI_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DALI_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.DALI_ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dali-release.jks"
      - run: npm ci --prefix mobile
      - run: npm run sync --prefix mobile
      - name: Build signed release
        working-directory: mobile/android
        env:
          DALI_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/dali-release.jks
          DALI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.DALI_ANDROID_KEYSTORE_PASSWORD }}
          DALI_ANDROID_KEY_ALIAS: ${{ secrets.DALI_ANDROID_KEY_ALIAS }}
          DALI_ANDROID_KEY_PASSWORD: ${{ secrets.DALI_ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: dali-mobile-android-release
          path: |
            mobile/android/app/build/outputs/apk/release/app-release.apk
            mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
