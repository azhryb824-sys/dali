name: Check Render repair access

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/render-access-check.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-access-check
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RENDER_API_KEY_SECRET: ${{ secrets.RENDER_API_KEY }}
      RENDER_API_TOKEN_SECRET: ${{ secrets.RENDER_API_TOKEN }}
      RENDER_SERVICE_ID_SECRET: ${{ secrets.RENDER_SERVICE_ID }}
      RENDER_DEPLOY_HOOK_URL_SECRET: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      TARGET_HOST: dali-ql1q.onrender.com
      TARGET_REPO: azhryb824-sys/dali
    steps:
      - name: Inspect available Render access without exposing secrets
        shell: bash
        run: |
          set -euo pipefail

          token="${RENDER_API_KEY_SECRET:-${RENDER_API_TOKEN_SECRET:-}}"
          if [[ -n "$token" ]]; then
            echo "render_api_access=present"
            echo "::add-mask::$token"
          else
            echo "render_api_access=absent"
          fi
          if [[ -n "${RENDER_SERVICE_ID_SECRET:-}" ]]; then
            echo "render_service_id=present"
          else
            echo "render_service_id=absent"
          fi
          if [[ -n "${RENDER_DEPLOY_HOOK_URL_SECRET:-}" ]]; then
            echo "render_deploy_hook=present"
          else
            echo "render_deploy_hook=absent"
          fi

          if [[ -z "$token" ]]; then
            echo "::error::No Render API key is available in GitHub Actions secrets."
            exit 1
          fi

          auth_header="Authorization: Bearer ${token}"
          service_id="${RENDER_SERVICE_ID_SECRET:-}"

          if [[ -z "$service_id" ]]; then
            curl --fail --silent --show-error \
              --header 'Accept: application/json' \
              --header "$auth_header" \
              'https://api.render.com/v1/services?name=dali&limit=100' \
              --output /tmp/render-services.json

            python <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path('/tmp/render-services.json').read_text())
          target_host = os.environ['TARGET_HOST'].lower()
          target_repo = os.environ['TARGET_REPO'].lower()
          items = payload if isinstance(payload, list) else payload.get('services') or payload.get('items') or []
          candidates = []
          for item in items:
              service = item.get('service', item) if isinstance(item, dict) else {}
              if not isinstance(service, dict):
                  continue
              service_id = str(service.get('id') or '')
              if not service_id.startswith('srv-'):
                  continue
              text = json.dumps(service, ensure_ascii=False).lower()
              score = 0
              if target_host in text:
                  score += 100
              if target_repo in text:
                  score += 50
              if str(service.get('name') or '').lower() == 'dali':
                  score += 20
              if score:
                  candidates.append((score, service_id, service))
          candidates.sort(key=lambda item: item[0], reverse=True)
          if not candidates or (len(candidates) > 1 and candidates[0][0] == candidates[1][0]):
              raise SystemExit('Unable to identify one Render service safely.')
          _, service_id, service = candidates[0]
          Path('/tmp/render-service-id').write_text(service_id)
          print(f"resolved_service_id={service_id}")
          print(f"resolved_service_name={service.get('name', '')}")
          print(f"resolved_service_branch={service.get('branch', '')}")
          print(f"resolved_service_repo={service.get('repo', '')}")
          PY
            service_id="$(cat /tmp/render-service-id)"
          fi

          echo "::add-mask::$service_id"
          echo "resolved_service=true"

          curl --fail --silent --show-error \
            --header 'Accept: application/json' \
            --header "$auth_header" \
            "https://api.render.com/v1/services/${service_id}" \
            --output /tmp/render-service.json

          curl --fail --silent --show-error \
            --header 'Accept: application/json' \
            --header "$auth_header" \
            "https://api.render.com/v1/disks?serviceId=${service_id}&limit=100" \
            --output /tmp/render-disks.json

          curl --fail --silent --show-error \
            --header 'Accept: application/json' \
            --header "$auth_header" \
            "https://api.render.com/v1/services/${service_id}/env-vars?limit=100" \
            --output /tmp/render-env.json

          python <<'PY'
          import json
          import re
          from pathlib import Path

          def unwrap(payload, plural, singular):
              items = payload if isinstance(payload, list) else payload.get(plural) or payload.get('items') or []
              result = []
              for item in items:
                  if isinstance(item, dict):
                      value = item.get(singular, item)
                      if isinstance(value, dict):
                          result.append(value)
              return result

          disks = unwrap(json.loads(Path('/tmp/render-disks.json').read_text()), 'disks', 'disk')
          print(f"persistent_disk_count={len(disks)}")
          for disk in disks:
              print(f"persistent_disk_mount={disk.get('mountPath') or disk.get('mount_path') or ''}")
              print(f"persistent_disk_name={disk.get('name') or ''}")

          envs = unwrap(json.loads(Path('/tmp/render-env.json').read_text()), 'envVars', 'envVar')
          values = {}
          for env in envs:
              key = str(env.get('key') or '')
              if key:
                  values[key] = str(env.get('value') or '')

          database_url = values.get('DATABASE_URL', '')
          scheme_match = re.match(r'^([A-Za-z][A-Za-z0-9+.-]*):', database_url)
          print(f"database_url_present={str(bool(database_url)).lower()}")
          print(f"database_url_scheme={(scheme_match.group(1).lower() if scheme_match else 'missing-or-invalid')}")
          print(f"uploads_dir_valid={str(values.get('UPLOADS_DIR') == '/var/data/uploads').lower()}")
          print(f"auth_mode_credentials={str(values.get('AUTH_MODE') == 'credentials').lower()}")
          print(f"admin_identifier_present={str(bool(values.get('PORTAL_ADMIN_IDENTIFIER') or values.get('PORTAL_ADMIN_ID'))).lower()}")
          print(f"admin_email_present={str(bool(values.get('PORTAL_ADMIN_EMAIL') or values.get('PORTAL_ADMIN_EMAILS'))).lower()}")
          print(f"admin_password_hash_present={str(values.get('PORTAL_ADMIN_PASSWORD_HASH', '').startswith('pbkdf2$')).lower()}")
          print(f"auth_secret_valid={str(len(values.get('AUTH_SECRET', '')) >= 32).lower()}")
          PY
