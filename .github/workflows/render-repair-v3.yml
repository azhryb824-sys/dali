name: Repair Render production via versioned CLI binary

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/render-repair-v3.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: repair-render-production-device-v3
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: "13"
      BASE_URL: https://dali-ql1q.onrender.com
      TARGET_HOST: dali-ql1q.onrender.com
      TARGET_REPO: azhryb824-sys/dali
      RENDER_CLI_VERSION: 2.22.0
      RENDER_CLI_SHA256: 6cdcd11897b7bd7e673317e6f4aaf041b654d818444f3b1efec7240a835f79ec
      RENDER_CLI_DISABLE_ANALYTICS: "1"
      NO_COLOR: "1"
      TERM: dumb
    steps:
      - name: Check out the controlled repair workflow
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Patch CLI binary discovery and execute the repair
        shell: bash
        run: |
          set -euo pipefail
          awk '
            /^        run: \|$/ { capture=1; next }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/render-repair-v2.yml > "${RUNNER_TEMP}/render-repair.sh"

          SCRIPT_PATH="${RUNNER_TEMP}/render-repair.sh" python <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ['SCRIPT_PATH'])
          text = path.read_text()
          old_discovery = 'RENDER_BIN="$(find "$cli_dir" -type f \\( -name render -o -name cli \\) -print -quit)"'
          new_discovery = 'RENDER_BIN="$(find "$cli_dir" -type f \\( -name render -o -name cli -o -name \'cli_*\' \\) -print -quit)"'
          if old_discovery not in text:
              raise SystemExit('The controlled CLI discovery statement was not found.')
          text = text.replace(old_discovery, new_discovery, 1)
          old_version = '"$RENDER_BIN" version\n\n: > "${RUNNER_TEMP}/render-login.log"'
          new_version = '"$RENDER_BIN" version || "$RENDER_BIN" --version || true\n\n: > "${RUNNER_TEMP}/render-login.log"'
          if old_version not in text:
              raise SystemExit('The controlled CLI version statement was not found.')
          text = text.replace(old_version, new_version, 1)
          path.write_text(text)
          PY

          chmod 700 "${RUNNER_TEMP}/render-repair.sh"
          bash "${RUNNER_TEMP}/render-repair.sh"
