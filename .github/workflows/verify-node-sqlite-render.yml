name: Verify Render Blueprint autodeploy

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/verify-node-sqlite-render.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: verify-render-blueprint-autodeploy
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      BASE_URL: https://dali-ql1q.onrender.com
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      EXPECTED_MAIN_SHA: f5be12c04d8caaa998e3802993a4dfdbdf296dcc
    steps:
      - name: Wait for Blueprint-triggered production release
        shell: bash
        run: |
          set -euo pipefail

          legacy_code="000"
          live_code="000"
          ready_code="000"
          login_code="000"

          for attempt in $(seq 1 30); do
            curl --fail --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${REPOSITORY}/actions/runs?branch=main&per_page=30" \
              --output /tmp/main-runs.json

            python <<'PY'
          import json
          import os
          from pathlib import Path

          expected = os.environ['EXPECTED_MAIN_SHA']
          runs = json.loads(Path('/tmp/main-runs.json').read_text()).get('workflow_runs', [])
          matches = [run for run in runs if run.get('head_sha') == expected]
          if matches:
              for run in matches:
                  print(
                      f"expected_main_run name={run.get('name')} event={run.get('event')} "
                      f"status={run.get('status')} conclusion={run.get('conclusion')} "
                      f"run_id={run.get('id')}"
                  )
          else:
              print('expected_main_run missing')
          PY

            legacy_code="$(curl --location --silent --show-error --max-time 35 \
              --output /tmp/dali-legacy.json --write-out '%{http_code}' \
              "${BASE_URL}/api/health" || true)"
            live_code="$(curl --location --silent --show-error --max-time 35 \
              --output /tmp/dali-live.json --write-out '%{http_code}' \
              "${BASE_URL}/api/health/live" || true)"
            ready_code="$(curl --location --silent --show-error --max-time 35 \
              --output /tmp/dali-ready.json --write-out '%{http_code}' \
              "${BASE_URL}/api/health/ready" || true)"
            login_code="$(curl --location --silent --show-error --max-time 35 \
              --output /tmp/dali-login.html --write-out '%{http_code}' \
              "${BASE_URL}/login" || true)"

            ready_preview="$(head -c 800 /tmp/dali-ready.json 2>/dev/null | tr '\n' ' ' || true)"
            echo "attempt=${attempt} legacy=${legacy_code:-000} live=${live_code:-000} ready=${ready_code:-000} login=${login_code:-000}"
            echo "ready=${ready_preview}"

            if [[ "$legacy_code" == "200" \
              && "$live_code" == "200" \
              && "$ready_code" == "200" \
              && "$login_code" == "200" ]] \
              && grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/dali-legacy.json \
              && grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/dali-live.json \
              && grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/dali-ready.json \
              && grep -Eq '"database"[[:space:]]*:[[:space:]]*"ok"' /tmp/dali-ready.json \
              && grep -Eq '"auth"[[:space:]]*:[[:space:]]*"ok"' /tmp/dali-ready.json \
              && grep -q 'تسجيل الدخول الآمن' /tmp/dali-login.html; then
              echo "Render Blueprint autodeploy and SQLite recovery verified."
              cat /tmp/dali-legacy.json
              cat /tmp/dali-live.json
              cat /tmp/dali-ready.json
              exit 0
            fi

            sleep 15
          done

          echo "::error::Render did not expose the Blueprint-triggered healthy release."
          echo "Final HTTP codes: legacy=${legacy_code:-000} live=${live_code:-000} ready=${ready_code:-000} login=${login_code:-000}"
          echo "--- legacy ---"
          cat /tmp/dali-legacy.json 2>/dev/null || true
          echo
          echo "--- live ---"
          cat /tmp/dali-live.json 2>/dev/null || true
          echo
          echo "--- ready ---"
          cat /tmp/dali-ready.json 2>/dev/null || true
          echo
          exit 1
