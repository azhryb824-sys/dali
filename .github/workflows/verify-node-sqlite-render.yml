name: Inspect Render deployment gate

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/verify-node-sqlite-render.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: inspect-render-deployment-gate
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      BASE_URL: https://dali-ql1q.onrender.com
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Inspect main CI runs and public Render health
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPOSITORY}/actions/runs?branch=main&per_page=50" \
            --output /tmp/main-runs.json

          python <<'PY'
          import json
          from pathlib import Path

          targets = {
              '4a57a480c1c671373268bebb4b2df0b25c1f84d6',
              'ee6017226d85553d24baefc469250269a9293a95',
              '353ba5e535ed9e86d8bc0e40efb23db7554fd6db',
          }
          payload = json.loads(Path('/tmp/main-runs.json').read_text())
          runs = payload.get('workflow_runs', [])
          print(f"main_run_count={len(runs)}")
          for run in runs:
              sha = str(run.get('head_sha') or '')
              if sha in targets:
                  print(
                      'target_run '
                      f"sha={sha} "
                      f"name={run.get('name')} "
                      f"event={run.get('event')} "
                      f"status={run.get('status')} "
                      f"conclusion={run.get('conclusion')} "
                      f"run_id={run.get('id')} "
                      f"created_at={run.get('created_at')} "
                      f"updated_at={run.get('updated_at')}"
                  )
          print('latest_main_runs')
          for run in runs[:12]:
              print(
                  f"sha={str(run.get('head_sha') or '')[:12]} "
                  f"name={run.get('name')} event={run.get('event')} "
                  f"status={run.get('status')} conclusion={run.get('conclusion')} "
                  f"run_id={run.get('id')}"
              )
          PY

          for path in /api/health /api/health/live /api/health/ready /login; do
            safe="$(printf '%s' "$path" | tr '/-' '__')"
            code="$(curl --location --silent --show-error --max-time 35 \
              --output "/tmp/${safe}.body" --write-out '%{http_code}' \
              "${BASE_URL}${path}" || true)"
            echo "render path=${path} http=${code:-000}"
            head -c 700 "/tmp/${safe}.body" 2>/dev/null || true
            echo
          done
