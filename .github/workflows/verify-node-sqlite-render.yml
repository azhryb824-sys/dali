name: Diagnose and repair Render production

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/verify-node-sqlite-render.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: diagnose-and-repair-render-production
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: "13"
      BASE_URL: https://dali-ql1q.onrender.com
      TARGET_HOST: dali-ql1q.onrender.com
      TARGET_REPO: azhryb824-sys/dali
      FAILED_DEPLOY_ID: dep-da3967u1egvs73c4gbn0
      RENDER_CLI_VERSION: 2.22.0
      RENDER_CLI_SHA256: 6cdcd11897b7bd7e673317e6f4aaf041b654d818444f3b1efec7240a835f79ec
      RENDER_CLI_DISABLE_ANALYTICS: "1"
      NO_COLOR: "1"
      TERM: dumb
    steps:
      - name: Authorize, diagnose, repair, deploy, and verify
        shell: bash
        run: |
          set -euo pipefail

          export RENDER_CLI_CONFIG_PATH="${RUNNER_TEMP}/render-cli.yaml"
          trap 'rm -f "${RENDER_CLI_CONFIG_PATH}" "${RUNNER_TEMP}/render-login.log"' EXIT

          post_comment() {
            local source_file="$1"
            COMMENT_SOURCE="$source_file" python <<'PY' > "${RUNNER_TEMP}/comment-payload.json"
          import json
          import os
          from pathlib import Path
          print(json.dumps({"body": Path(os.environ["COMMENT_SOURCE"]).read_text()}, ensure_ascii=False))
          PY
            curl --fail --silent --show-error \
              --request POST \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --header 'Content-Type: application/json' \
              "https://api.github.com/repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --data-binary "@${RUNNER_TEMP}/comment-payload.json" \
              --output "${RUNNER_TEMP}/comment-response.json"
          }

          github_main_sha() {
            curl --fail --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${REPOSITORY}/branches/main" \
              --output "${RUNNER_TEMP}/main-branch.json"
            python -c 'import json; print(json.load(open("'"${RUNNER_TEMP}/main-branch.json"'"))["commit"]["sha"])'
          }

          render_get() {
            local path="$1"
            local destination="$2"
            curl --fail --silent --show-error \
              --header 'Accept: application/json' \
              --header "Authorization: Bearer ${RENDER_TOKEN}" \
              "https://api.render.com/v1${path}" \
              --output "$destination"
          }

          cli_zip="${RUNNER_TEMP}/render-cli.zip"
          cli_dir="${RUNNER_TEMP}/render-cli-bin"
          mkdir -p "$cli_dir"
          curl --fail --location --silent --show-error \
            --retry 3 --retry-all-errors \
            "https://github.com/render-oss/cli/releases/download/v${RENDER_CLI_VERSION}/cli_${RENDER_CLI_VERSION}_linux_amd64.zip" \
            --output "$cli_zip"
          echo "${RENDER_CLI_SHA256}  ${cli_zip}" | sha256sum --check --status
          unzip -q "$cli_zip" -d "$cli_dir"
          RENDER_BIN="${cli_dir}/cli_v${RENDER_CLI_VERSION}"
          [[ -f "$RENDER_BIN" ]] || { echo "::error::Verified Render CLI executable was not found."; exit 1; }
          chmod +x "$RENDER_BIN"
          "$RENDER_BIN" --version

          : > "${RUNNER_TEMP}/render-login.log"
          timeout 720 "$RENDER_BIN" login > "${RUNNER_TEMP}/render-login.log" 2>&1 &
          LOGIN_PID=$!

          AUTH_URL=""
          USER_CODE=""
          for _ in $(seq 1 90); do
            if ! kill -0 "$LOGIN_PID" 2>/dev/null; then
              break
            fi
            LOGIN_LOG="${RUNNER_TEMP}/render-login.log" python <<'PY' > "${RUNNER_TEMP}/render-auth.json"
          import json
          import os
          import re
          from pathlib import Path
          text = Path(os.environ["LOGIN_LOG"]).read_text(errors="replace")
          text = re.sub(r"\x1b\[[0-9;?]*[ -/]*[@-~]", "", text)
          urls = [item.rstrip(".,);]>") for item in re.findall(r"https://[^\s<]+", text)]
          url = next((item for item in urls if "dashboard.render.com/device-authorization/" in item), "")
          code_match = re.search(r"(?i)code:\s*([A-Z0-9-]{4,32})", text)
          print(json.dumps({"url": url, "code": code_match.group(1) if code_match else ""}))
          PY
            AUTH_URL="$(python -c 'import json; print(json.load(open("'"${RUNNER_TEMP}/render-auth.json"'"))["url"])')"
            USER_CODE="$(python -c 'import json; print(json.load(open("'"${RUNNER_TEMP}/render-auth.json"'"))["code"])')"
            [[ -n "$AUTH_URL" ]] && break
            sleep 1
          done

          if [[ -z "$AUTH_URL" ]]; then
            cat > "${RUNNER_TEMP}/comment.md" <<'EOF'
          ### تعذر إنشاء رابط تفويض Render

          لم تبدأ جلسة التفويض، ولم تُغيّر أي إعدادات أو بيانات في Render.
          EOF
            post_comment "${RUNNER_TEMP}/comment.md"
            kill "$LOGIN_PID" 2>/dev/null || true
            wait "$LOGIN_PID" 2>/dev/null || true
            exit 1
          fi

          cat > "${RUNNER_TEMP}/comment.md" <<EOF
          ### تفويض Render التشخيصي المؤقت مطلوب

          افتح رابط Render الرسمي التالي بالحساب الذي يملك خدمة **dali**، ثم اضغط **Authorize CLI**:

          ${AUTH_URL}

          رمز التفويض: **${USER_CODE}**

          ستقرأ الجلسة سجلات النشر الفاشل وإعدادات القرص دون عرض الأسرار، ثم تبقى نشطة فترة محدودة لاستقبال الإصلاح على `main` ونشره والتحقق منه. يُحذف ملف التفويض تلقائيًا عند انتهاء المهمة.
          EOF
          post_comment "${RUNNER_TEMP}/comment.md"

          set +e
          wait "$LOGIN_PID"
          LOGIN_STATUS=$?
          set -e
          if [[ "$LOGIN_STATUS" -ne 0 ]]; then
            cat > "${RUNNER_TEMP}/comment.md" <<'EOF'
          ### انتهت جلسة تفويض Render دون موافقة

          لم تُغيّر المهمة أي إعداد أو بيانات في Render.
          EOF
            post_comment "${RUNNER_TEMP}/comment.md"
            exit 1
          fi

          RENDER_TOKEN="$(CONFIG_PATH="$RENDER_CLI_CONFIG_PATH" python <<'PY'
          import os
          import re
          from pathlib import Path
          text = Path(os.environ["CONFIG_PATH"]).read_text()
          match = re.search(r'(?m)^\s+key:\s*["\x27]?([^"\x27\s]+)', text)
          print(match.group(1) if match else "")
          PY
          )"
          [[ -n "$RENDER_TOKEN" ]] || { echo "::error::Temporary Render token was not found."; exit 1; }
          echo "::add-mask::${RENDER_TOKEN}"

          INITIAL_MAIN_SHA="$(github_main_sha)"
          [[ "$INITIAL_MAIN_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::Unable to resolve main SHA."; exit 1; }

          "$RENDER_BIN" workspaces --output json > "${RUNNER_TEMP}/workspaces.json"
          WORKSPACES_JSON="${RUNNER_TEMP}/workspaces.json" python <<'PY' > "${RUNNER_TEMP}/workspaces.tsv"
          import json
          import os
          from pathlib import Path
          data = json.loads(Path(os.environ["WORKSPACES_JSON"]).read_text())
          found = {}
          def walk(value):
              if isinstance(value, dict):
                  lower = {str(k).lower(): v for k, v in value.items()}
                  identifier = str(lower.get("id") or "").strip()
                  name = str(lower.get("name") or lower.get("email") or "").strip()
                  if identifier and name and not identifier.startswith(("srv-", "dpg-", "red-", "crn-", "job-")):
                      found[identifier] = name
                  for child in value.values():
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)
          walk(data)
          for identifier, name in sorted(found.items()):
              print(f"{identifier}\t{name.replace(chr(9), ' ')}")
          PY
          [[ -s "${RUNNER_TEMP}/workspaces.tsv" ]] || { echo "::error::No Render workspace was available."; exit 1; }

          : > "${RUNNER_TEMP}/service-candidates.jsonl"
          workspace_index=0
          while IFS=$'\t' read -r WORKSPACE_ID WORKSPACE_NAME; do
            workspace_index=$((workspace_index + 1))
            export RENDER_WORKSPACE="$WORKSPACE_ID"
            services_file="${RUNNER_TEMP}/services-${workspace_index}.json"
            if ! "$RENDER_BIN" services --output json > "$services_file" 2>/dev/null; then
              continue
            fi
            SERVICES_JSON="$services_file" WORKSPACE_ID="$WORKSPACE_ID" WORKSPACE_NAME="$WORKSPACE_NAME" TARGET_HOST="$TARGET_HOST" TARGET_REPO="$TARGET_REPO" python <<'PY' >> "${RUNNER_TEMP}/service-candidates.jsonl"
          import json
          import os
          from pathlib import Path
          data = json.loads(Path(os.environ["SERVICES_JSON"]).read_text())
          target_host = os.environ["TARGET_HOST"].lower()
          target_repo = os.environ["TARGET_REPO"].lower()
          workspace_id = os.environ["WORKSPACE_ID"]
          workspace_name = os.environ["WORKSPACE_NAME"]
          found = {}
          def walk(value):
              if isinstance(value, dict):
                  lower = {str(k).lower(): v for k, v in value.items()}
                  identifier = str(lower.get("id") or "").strip()
                  if identifier.startswith("srv-"):
                      name = str(lower.get("name") or "").strip()
                      text = json.dumps(value, ensure_ascii=False).lower()
                      score = (100 if target_host in text else 0) + (50 if target_repo in text else 0) + (20 if name.lower() == "dali" else 0) + (5 if str(lower.get("branch") or "").lower() == "main" else 0)
                      found[identifier] = {"service_id": identifier, "service_name": name, "workspace_id": workspace_id, "workspace_name": workspace_name, "score": score}
                  for child in value.values():
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)
          walk(data)
          for record in found.values():
              print(json.dumps(record, ensure_ascii=False))
          PY
          done < "${RUNNER_TEMP}/workspaces.tsv"

          CANDIDATES_FILE="${RUNNER_TEMP}/service-candidates.jsonl" python <<'PY'
          import json
          import os
          from pathlib import Path
          records = [json.loads(line) for line in Path(os.environ["CANDIDATES_FILE"]).read_text().splitlines() if line.strip()]
          best = {}
          for record in records:
              if record["service_id"] not in best or record["score"] > best[record["service_id"]]["score"]:
                  best[record["service_id"]] = record
          ranked = sorted(best.values(), key=lambda item: (-item["score"], item["service_id"]))
          if not ranked or ranked[0]["score"] < 70:
              raise SystemExit("Unable to identify the Dali Render service safely.")
          if len(ranked) > 1 and ranked[0]["score"] == ranked[1]["score"]:
              raise SystemExit("Multiple Render services matched with equal confidence.")
          selected = ranked[0]
          root = Path(os.environ["RUNNER_TEMP"])
          root.joinpath("render-service-id").write_text(selected["service_id"])
          root.joinpath("render-workspace-id").write_text(selected["workspace_id"])
          root.joinpath("render-service-name").write_text(selected["service_name"])
          root.joinpath("render-workspace-name").write_text(selected["workspace_name"])
          PY

          SERVICE_ID="$(cat "${RUNNER_TEMP}/render-service-id")"
          WORKSPACE_ID="$(cat "${RUNNER_TEMP}/render-workspace-id")"
          export RENDER_WORKSPACE="$WORKSPACE_ID"
          echo "::add-mask::${SERVICE_ID}"
          echo "::add-mask::${WORKSPACE_ID}"

          render_get "/services/${SERVICE_ID}" "${RUNNER_TEMP}/service.json"
          render_get "/services/${SERVICE_ID}/env-vars" "${RUNNER_TEMP}/env-vars.json" || echo '[]' > "${RUNNER_TEMP}/env-vars.json"
          render_get "/disks?serviceId=${SERVICE_ID}&limit=20" "${RUNNER_TEMP}/disks.json" || echo '[]' > "${RUNNER_TEMP}/disks.json"
          render_get "/services/${SERVICE_ID}/deploys?limit=30" "${RUNNER_TEMP}/deploys.json"
          if ! render_get "/services/${SERVICE_ID}/deploys/${FAILED_DEPLOY_ID}" "${RUNNER_TEMP}/failed-deploy.json"; then
            echo '{}' > "${RUNNER_TEMP}/failed-deploy.json"
          fi

          START_TIME="$(date -u -d '120 minutes ago' +'%Y-%m-%dT%H:%M:%SZ')"
          END_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          set +e
          "$RENDER_BIN" logs --resources "$SERVICE_ID" --start "$START_TIME" --end "$END_TIME" --type build --direction forward --limit 500 --output text > "${RUNNER_TEMP}/build.log" 2>&1
          BUILD_LOG_STATUS=$?
          "$RENDER_BIN" logs --resources "$SERVICE_ID" --start "$START_TIME" --end "$END_TIME" --type app --direction forward --limit 500 --output text > "${RUNNER_TEMP}/app.log" 2>&1
          APP_LOG_STATUS=$?
          set -e

          SERVICE_JSON="${RUNNER_TEMP}/service.json" ENV_JSON="${RUNNER_TEMP}/env-vars.json" DISKS_JSON="${RUNNER_TEMP}/disks.json" DEPLOYS_JSON="${RUNNER_TEMP}/deploys.json" FAILED_DEPLOY_JSON="${RUNNER_TEMP}/failed-deploy.json" BUILD_LOG="${RUNNER_TEMP}/build.log" APP_LOG="${RUNNER_TEMP}/app.log" SERVICE_ID="$SERVICE_ID" WORKSPACE_ID="$WORKSPACE_ID" FAILED_DEPLOY_ID="$FAILED_DEPLOY_ID" BUILD_LOG_STATUS="$BUILD_LOG_STATUS" APP_LOG_STATUS="$APP_LOG_STATUS" python <<'PY' > "${RUNNER_TEMP}/diagnostic.md"
          import json
          import os
          import re
          from pathlib import Path

          def read_json(name, default):
              try:
                  return json.loads(Path(os.environ[name]).read_text())
              except Exception:
                  return default

          def flatten_records(value):
              result = []
              if isinstance(value, list):
                  for item in value:
                      result.extend(flatten_records(item))
              elif isinstance(value, dict):
                  if any(key in value for key in ("id", "key", "mountPath", "status")):
                      result.append(value)
                  for child in value.values():
                      if isinstance(child, (dict, list)):
                          result.extend(flatten_records(child))
              return result

          service = read_json("SERVICE_JSON", {})
          env_payload = read_json("ENV_JSON", [])
          disks_payload = read_json("DISKS_JSON", [])
          deploys_payload = read_json("DEPLOYS_JSON", [])
          failed = read_json("FAILED_DEPLOY_JSON", {})
          service_details = service.get("serviceDetails") or service.get("service_details") or {}
          env_records = flatten_records(env_payload)
          env_map = {}
          for item in env_records:
              key = str(item.get("key") or item.get("name") or "")
              if key:
                  env_map[key] = str(item.get("value") or "")
          disks = []
          for item in flatten_records(disks_payload):
              mount = item.get("mountPath") or item.get("mount_path")
              if mount:
                  disks.append({
                      "mount": str(mount),
                      "name": str(item.get("name") or "غير مسمى"),
                      "size": str(item.get("sizeGB") or item.get("sizeGb") or item.get("size") or "غير معروف"),
                  })
          deploy_records = [item for item in flatten_records(deploys_payload) if str(item.get("id") or "").startswith("dep-")]
          failed_record = failed if isinstance(failed, dict) else {}
          if not failed_record:
              failed_record = next((item for item in deploy_records if item.get("id") == os.environ["FAILED_DEPLOY_ID"]), {})
          latest = deploy_records[0] if deploy_records else {}

          def safe_text(path_name):
              text = Path(os.environ[path_name]).read_text(errors="replace")
              text = re.sub(r"\x1b\[[0-9;?]*[ -/]*[@-~]", "", text)
              text = text.replace(os.environ["SERVICE_ID"], "[SERVICE_ID]")
              text = text.replace(os.environ["WORKSPACE_ID"], "[WORKSPACE_ID]")
              text = text.replace(os.environ["FAILED_DEPLOY_ID"], "[DEPLOY_ID]")
              text = re.sub(r"(?i)(authorization:\s*bearer\s+)[^\s]+", r"\1[REDACTED]", text)
              text = re.sub(r"(?i)\b(sk|rnd|re|token)[-_][A-Za-z0-9_-]{20,}\b", "[REDACTED_TOKEN]", text)
              text = re.sub(r"(?i)(DATABASE_URL|AUTH_SECRET|PASSWORD_HASH|API_KEY)\s*[=:]\s*\S+", r"\1=[REDACTED]", text)
              text = re.sub(r"\b[A-Fa-f0-9]{40,}\b", "[REDACTED_HEX]", text)
              lines = text.splitlines()
              important = [line for line in lines if re.search(r"(?i)error|failed|failure|exception|npm err|enoent|eacces|sqlite|libsql|migration|startup|health|exit|signal|cannot|unsupported|invalid|database", line)]
              selected = important[-160:] if important else lines[-100:]
              return "\n".join(selected)[-18000:] or "(لا توجد سطور متاحة)"

          build_excerpt = safe_text("BUILD_LOG")
          app_excerpt = safe_text("APP_LOG")
          repo = service_details.get("repo") or service.get("repo") or ""
          branch = service_details.get("branch") or service.get("branch") or ""
          build_command = service_details.get("buildCommand") or service_details.get("build_command") or ""
          start_command = service_details.get("startCommand") or service_details.get("start_command") or ""
          health_path = service_details.get("healthCheckPath") or service_details.get("health_check_path") or ""
          auto_deploy = service.get("autoDeployTrigger") or service.get("autoDeploy") or service_details.get("autoDeployTrigger") or ""

          print("### تشخيص نشر Render الفاشل")
          print()
          print(f"- الخدمة المطابقة: **{service.get('name') or 'dali'}**")
          print(f"- المستودع مطابق: **{'نعم' if 'azhryb824-sys/dali' in str(repo).lower() else 'غير مؤكد'}**")
          print(f"- الفرع: `{branch or 'غير معروف'}`")
          print(f"- أمر البناء: `{build_command or 'غير معروف'}`")
          print(f"- أمر التشغيل: `{start_command or 'غير معروف'}`")
          print(f"- مسار فحص الصحة: `{health_path or 'غير معروف'}`")
          print(f"- النشر التلقائي: `{auto_deploy or 'غير معروف'}`")
          print(f"- DATABASE_URL مضبوط على المسار المطلوب: **{'نعم' if env_map.get('DATABASE_URL') == 'file:/var/data/dali.db' else 'لا'}**")
          print(f"- UPLOADS_DIR مضبوط على المسار المطلوب: **{'نعم' if env_map.get('UPLOADS_DIR') == '/var/data/uploads' else 'لا'}**")
          print(f"- AUTH_MODE مضبوط على credentials: **{'نعم' if env_map.get('AUTH_MODE') == 'credentials' else 'لا'}**")
          if disks:
              print("- الأقراص المرتبطة:")
              for disk in disks:
                  print(f"  - `{disk['name']}` عند `{disk['mount']}` بحجم `{disk['size']} GB`")
          else:
              print("- الأقراص المرتبطة: **لم يظهر قرص في استجابة Render API**")
          print(f"- حالة النشر الفاشل: `{failed_record.get('status') or 'غير معروفة'}`")
          print(f"- حالة أحدث نشر: `{latest.get('status') or 'غير معروفة'}`")
          print(f"- قراءة سجل البناء: `exit {os.environ['BUILD_LOG_STATUS']}`")
          print(f"- قراءة سجل التطبيق: `exit {os.environ['APP_LOG_STATUS']}`")
          print()
          print("#### مقتطف سجل البناء المنقح")
          print("```text")
          print(build_excerpt)
          print("```")
          print()
          print("#### مقتطف سجل التشغيل المنقح")
          print("```text")
          print(app_excerpt)
          print("```")
          print()
          print("لم تُحذف أو تُستبدل أي بيانات أو أقراص. تبقى الجلسة المؤقتة نشطة لاستقبال إصلاح جديد على `main`.")
          PY
          post_comment "${RUNNER_TEMP}/diagnostic.md"

          cat > "${RUNNER_TEMP}/waiting.md" <<EOF
          ### بانتظار التزام الإصلاح

          اكتمل استخراج تشخيص Render المنقح. ستراقب الجلسة فرع `main` فترة محدودة، وستنشر أول التزام جديد بعد `${INITIAL_MAIN_SHA}` ثم تتحقق من قاعدة البيانات والمصادقة وصفحة الدخول.
          EOF
          post_comment "${RUNNER_TEMP}/waiting.md"

          NEW_MAIN_SHA=""
          for _ in $(seq 1 90); do
            candidate="$(github_main_sha)"
            if [[ "$candidate" =~ ^[a-f0-9]{40}$ && "$candidate" != "$INITIAL_MAIN_SHA" ]]; then
              NEW_MAIN_SHA="$candidate"
              break
            fi
            sleep 10
          done

          if [[ -z "$NEW_MAIN_SHA" ]]; then
            cat > "${RUNNER_TEMP}/timeout.md" <<'EOF'
          ### انتهت نافذة الإصلاح المؤقتة

          تم نشر التشخيص أعلاه، لكن لم يصل التزام جديد إلى `main` خلال مدة الجلسة. لم تُجرَ أي عملية حذف أو استبدال للبيانات.
          EOF
            post_comment "${RUNNER_TEMP}/timeout.md"
            exit 1
          fi

          "$RENDER_BIN" services update "$SERVICE_ID" \
            --branch main \
            --build-command 'npm ci && npm run build' \
            --start-command 'npm run start:render' \
            --health-check-path '/api/health/live' \
            --auto-deploy \
            --output json > "${RUNNER_TEMP}/service-update.json"

          set +e
          "$RENDER_BIN" deploys create "$SERVICE_ID" --commit "$NEW_MAIN_SHA" --wait --confirm --output json > "${RUNNER_TEMP}/deploy-fixed.json" 2> "${RUNNER_TEMP}/deploy-fixed.err"
          DEPLOY_STATUS=$?
          set -e

          if [[ "$DEPLOY_STATUS" -ne 0 ]]; then
            END_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            START_TIME="$(date -u -d '45 minutes ago' +'%Y-%m-%dT%H:%M:%SZ')"
            set +e
            "$RENDER_BIN" logs --resources "$SERVICE_ID" --start "$START_TIME" --end "$END_TIME" --type build,app --direction forward --limit 500 --output text > "${RUNNER_TEMP}/fixed-deploy.log" 2>&1
            set -e
            FIX_LOG="${RUNNER_TEMP}/fixed-deploy.log" SERVICE_ID="$SERVICE_ID" WORKSPACE_ID="$WORKSPACE_ID" python <<'PY' > "${RUNNER_TEMP}/fixed-failure.md"
          import os
          import re
          from pathlib import Path
          text = Path(os.environ["FIX_LOG"]).read_text(errors="replace")
          text = text.replace(os.environ["SERVICE_ID"], "[SERVICE_ID]").replace(os.environ["WORKSPACE_ID"], "[WORKSPACE_ID]")
          text = re.sub(r"(?i)(authorization:\s*bearer\s+)[^\s]+", r"\1[REDACTED]", text)
          text = re.sub(r"(?i)(DATABASE_URL|AUTH_SECRET|PASSWORD_HASH|API_KEY)\s*[=:]\s*\S+", r"\1=[REDACTED]", text)
          lines = [line for line in text.splitlines() if re.search(r"(?i)error|failed|exception|npm err|enoent|eacces|sqlite|libsql|migration|startup|health|exit|cannot", line)]
          excerpt = "\n".join(lines[-160:])[-18000:] or "(تعذر استخراج سطور الخطأ)"
          print("### فشل نشر التزام الإصلاح")
          print()
          print("```text")
          print(excerpt)
          print("```")
          print()
          print("لم تُحذف أي بيانات، وتبقى النسخة السابقة متاحة.")
          PY
            post_comment "${RUNNER_TEMP}/fixed-failure.md"
            exit 1
          fi

          legacy_code="000"
          live_code="000"
          ready_code="000"
          login_code="000"
          for attempt in $(seq 1 48); do
            legacy_code="$(curl --location --silent --show-error --max-time 35 --output "${RUNNER_TEMP}/legacy.json" --write-out '%{http_code}' "${BASE_URL}/api/health" || true)"
            live_code="$(curl --location --silent --show-error --max-time 35 --output "${RUNNER_TEMP}/live.json" --write-out '%{http_code}' "${BASE_URL}/api/health/live" || true)"
            ready_code="$(curl --location --silent --show-error --max-time 35 --output "${RUNNER_TEMP}/ready.json" --write-out '%{http_code}' "${BASE_URL}/api/health/ready" || true)"
            login_code="$(curl --location --silent --show-error --max-time 35 --output "${RUNNER_TEMP}/login.html" --write-out '%{http_code}' "${BASE_URL}/login" || true)"

            if [[ "$legacy_code" == "200" && "$live_code" == "200" && "$ready_code" == "200" && "$login_code" == "200" ]] \
              && grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' "${RUNNER_TEMP}/legacy.json" \
              && grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' "${RUNNER_TEMP}/live.json" \
              && grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' "${RUNNER_TEMP}/ready.json" \
              && grep -Eq '"database"[[:space:]]*:[[:space:]]*"ok"' "${RUNNER_TEMP}/ready.json" \
              && grep -Eq '"auth"[[:space:]]*:[[:space:]]*"ok"' "${RUNNER_TEMP}/ready.json" \
              && grep -q 'تسجيل الدخول الآمن' "${RUNNER_TEMP}/login.html"; then
              cat > "${RUNNER_TEMP}/success.md" <<EOF
          ### تم إصلاح Render والتحقق من النسخة المنشورة

          - نُشر الالتزام `${NEW_MAIN_SHA}`.
          - فحص حياة الخدمة: **سليم**.
          - اتصال قاعدة البيانات: **سليم**.
          - إعداد المصادقة: **سليم**.
          - صفحة تسجيل الدخول: **متاحة**.
          - لم تُحذف أي بيانات، وظلت حماية النسخ الاحتياطية قبل الهجرات مفعّلة.
          EOF
              post_comment "${RUNNER_TEMP}/success.md"
              "$RENDER_BIN" logout >/dev/null 2>&1 || true
              exit 0
            fi
            sleep 12
          done

          cat > "${RUNNER_TEMP}/not-ready.md" <<EOF
          ### نُشر الإصلاح لكن الجاهزية لم تكتمل

          - `/api/health`: HTTP ${legacy_code}
          - `/api/health/live`: HTTP ${live_code}
          - `/api/health/ready`: HTTP ${ready_code}
          - `/login`: HTTP ${login_code}

          لم تُحذف أي بيانات. راجع استجابة الجاهزية وسجلات Render قبل نشر إضافي.
          EOF
          post_comment "${RUNNER_TEMP}/not-ready.md"
          exit 1
