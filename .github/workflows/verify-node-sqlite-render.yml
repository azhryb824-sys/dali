name: Inspect GitHub Render access paths

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/verify-node-sqlite-render.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  deployments: read

concurrency:
  group: inspect-github-render-access-paths
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      BASE_URL: https://dali-ql1q.onrender.com
    steps:
      - name: Inspect environment and variable names without exposing values
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ['GH_TOKEN']
          repository = os.environ['REPOSITORY']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def get(path):
              request = urllib.request.Request(f'https://api.github.com/repos/{repository}{path}', headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return response.status, json.load(response)
              except urllib.error.HTTPError as error:
                  try:
                      body = json.loads(error.read().decode('utf-8'))
                      message = body.get('message', '')
                  except Exception:
                      message = ''
                  return error.code, {'message': message}

          status, payload = get('/environments?per_page=100')
          print(f'environments_http={status}')
          environments = payload.get('environments', []) if isinstance(payload, dict) else []
          print(f'environment_count={len(environments)}')
          for environment in environments:
              name = str(environment.get('name') or '')
              print(f'environment_name={name}')
              encoded = urllib.parse.quote(name, safe='')
              variable_status, variable_payload = get(f'/environments/{encoded}/variables?per_page=100')
              variable_names = [str(item.get('name') or '') for item in variable_payload.get('variables', [])] if isinstance(variable_payload, dict) else []
              print(f'environment_variables_http={variable_status} environment={name} names={','.join(variable_names)}')
              secret_status, secret_payload = get(f'/environments/{encoded}/secrets?per_page=100')
              secret_names = [str(item.get('name') or '') for item in secret_payload.get('secrets', [])] if isinstance(secret_payload, dict) else []
              print(f'environment_secrets_http={secret_status} environment={name} names={','.join(secret_names)}')

          variable_status, variable_payload = get('/actions/variables?per_page=100')
          variable_names = [str(item.get('name') or '') for item in variable_payload.get('variables', [])] if isinstance(variable_payload, dict) else []
          print(f'repository_variables_http={variable_status} names={','.join(variable_names)}')

          secret_status, secret_payload = get('/actions/secrets?per_page=100')
          secret_names = [str(item.get('name') or '') for item in secret_payload.get('secrets', [])] if isinstance(secret_payload, dict) else []
          print(f'repository_secrets_http={secret_status} names={','.join(secret_names)}')
          PY

          for path in /api/health /api/health/live /api/health/ready /login; do
            safe="$(printf '%s' "$path" | tr '/-' '__')"
            code="$(curl --location --silent --show-error --max-time 35 \
              --output "/tmp/${safe}.body" --write-out '%{http_code}' \
              "${BASE_URL}${path}" || true)"
            echo "render path=${path} http=${code:-000}"
            head -c 700 "/tmp/${safe}.body" 2>/dev/null || true
            echo
          done
