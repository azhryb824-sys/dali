name: Verify Render runtime recovery

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/verify-render-runtime-recovery.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-render-runtime-recovery
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      BASE_URL: https://dali-ql1q.onrender.com
    steps:
      - name: Capture deployed health and login routes after Node client deployment
        shell: bash
        run: |
          set +e
          for path in /api/health /api/health/live /api/health/ready /login; do
            safe="$(printf '%s' "$path" | tr '/-' '__')"
            code="$(curl --location --silent --show-error --max-time 45 \
              --dump-header "/tmp/${safe}.headers" \
              --output "/tmp/${safe}.body" \
              --write-out '%{http_code}' \
              "${BASE_URL}${path}")"
            curl_status=$?
            echo "--- path=${path} curl=${curl_status} http=${code:-000} ---"
            grep -Ei '^(HTTP/|content-type:|location:|set-cookie:|x-request-id:)' "/tmp/${safe}.headers" || true
            head -c 2200 "/tmp/${safe}.body" || true
            echo
          done
          exit 0
