name: Verify Render runtime recovery

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/verify-render-runtime-recovery.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-render-runtime-recovery
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BASE_URL: https://dali-ql1q.onrender.com
    steps:
      - name: Verify merged database recovery and credential auth
        shell: bash
        run: |
          set -u
          legacy_code="000"
          live_code="000"
          ready_code="000"
          login_code="000"

          for attempt in $(seq 1 36); do
            legacy_code="$(curl --location --silent --show-error --max-time 35 --output /tmp/legacy.json --write-out '%{http_code}' "${BASE_URL}/api/health" || true)"
            live_code="$(curl --location --silent --show-error --max-time 35 --output /tmp/live.json --write-out '%{http_code}' "${BASE_URL}/api/health/live" || true)"
            ready_code="$(curl --location --silent --show-error --max-time 35 --output /tmp/ready.json --write-out '%{http_code}' "${BASE_URL}/api/health/ready" || true)"
            login_code="$(curl --location --silent --show-error --max-time 35 --output /tmp/login.html --write-out '%{http_code}' "${BASE_URL}/login" || true)"

            echo "attempt=${attempt} legacy=${legacy_code:-000} live=${live_code:-000} ready=${ready_code:-000} login=${login_code:-000}"
            echo -n "ready_body="; head -c 700 /tmp/ready.json 2>/dev/null || true; echo

            if [[ "$legacy_code" == "200" && "$live_code" == "200" && "$ready_code" == "200" && "$login_code" == "200" ]] \
              && grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/legacy.json \
              && grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/live.json \
              && grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/ready.json \
              && grep -Eq '"database"[[:space:]]*:[[:space:]]*"ok"' /tmp/ready.json \
              && grep -Eq '"auth"[[:space:]]*:[[:space:]]*"ok"' /tmp/ready.json \
              && grep -q 'تسجيل الدخول الآمن' /tmp/login.html; then
              echo "Render database recovery is live and ready."
              cat /tmp/legacy.json
              cat /tmp/live.json
              cat /tmp/ready.json
              exit 0
            fi

            sleep 15
          done

          echo "::error::Render did not become database-ready within the bounded verification window."
          echo "Final HTTP codes: legacy=${legacy_code:-000} live=${live_code:-000} ready=${ready_code:-000} login=${login_code:-000}"
          echo "--- legacy ---"; cat /tmp/legacy.json 2>/dev/null || true; echo
          echo "--- live ---"; cat /tmp/live.json 2>/dev/null || true; echo
          echo "--- ready ---"; cat /tmp/ready.json 2>/dev/null || true; echo
          echo "--- login preview ---"; head -c 1200 /tmp/login.html 2>/dev/null || true; echo
          exit 1
