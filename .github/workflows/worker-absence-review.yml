name: Worker absence review
on:
  push:
    branches: [codex/owner-admin-worker-absence-20260921]
    paths: [.github/workflows/worker-absence-review.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded source changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          def replace(text, old, new):
              assert text.count(old) == 1, f'Expected one match: {old[:150]}'
              return text.replace(old,new,1)
          path=Path('app/portal/PortalDashboard.tsx')
          assert subprocess.check_output(['git','hash-object',str(path)],text=True).strip() == '4a04ad725bf13ec816f6051d7acd76d645d1f78e'
          text=path.read_text()
          text=replace(text,'import ContractWorkforceBoard from "./ContractWorkforceBoard";', 'import ContractWorkforceBoard from "./ContractWorkforceBoard";\nimport { canManageWorkerAttendance } from "@/lib/worker-attendance-access";')
          text=replace(text,'canManageWorkerAssignments={canManageWorkerAssignments} isAdmin=', 'canManageWorkerAssignments={canManageWorkerAssignments} canManageAttendance={canManageWorkerAttendance(currentUser)} isAdmin=')
          before,drawer=text.split('function ContractDrawer(',1)
          drawer,after=drawer.split('\nfunction WorkerTable(',1)
          drawer=replace(drawer,'  canManageWorkerAssignments,','  canManageWorkerAssignments,\n  canManageAttendance,')
          drawer=replace(drawer,'  canManageWorkerAssignments: boolean;','  canManageWorkerAssignments: boolean;\n  canManageAttendance: boolean;')
          drawer=replace(drawer,'const [canRecordAbsence, setCanRecordAbsence] = useState(isOwner);','const [canRecordAbsence, setCanRecordAbsence] = useState(false);\n  const [attendanceRevision, setAttendanceRevision] = useState(0);')
          drawer=replace(drawer,'const [canViewAbsenceFinance, setCanViewAbsenceFinance] = useState(isOwner);','const [canViewAbsenceFinance, setCanViewAbsenceFinance] = useState(false);')
          drawer=replace(drawer,'    let active = true;\n    fetch(`/api/portal/contracts/${contract.id}/attendance`, { cache: "no-store" })','    let active = true;\n    const controller = new AbortController();\n    const timeout = setTimeout(() => controller.abort(), 15000);\n    setAbsenceHistoryLoading(true);\n    setAbsenceError("");\n    setCanRecordAbsence(false);\n    setPendingVoidAbsenceId(null);\n    fetch(`/api/portal/contracts/${contract.id}/attendance`, { cache: "no-store", signal: controller.signal })')
          drawer=replace(drawer,'setCanRecordAbsence(Boolean(result.canRecord));','setCanRecordAbsence(canManageAttendance && result.canRecord === true);')
          drawer=replace(drawer,'setAbsenceError(error instanceof Error ? error.message : "تعذر تحميل سجل الغياب");','setAbsenceError(controller.signal.aborted ? "تعذر تحميل سجل الغياب" : error instanceof Error ? error.message : "تعذر تحميل سجل الغياب");')
          drawer=replace(drawer,'      .finally(() => {\n        if (active) setAbsenceHistoryLoading(false);','      .finally(() => {\n        clearTimeout(timeout);\n        if (active) setAbsenceHistoryLoading(false);')
          drawer=replace(drawer,'      active = false;\n    };\n  }, [contract.id]);','      active = false;\n      clearTimeout(timeout);\n      controller.abort();\n    };\n  }, [contract.id, canManageAttendance, attendanceRevision]);')
          drawer=replace(drawer,'{absenceError && <p role="alert" className="form-error">{absenceError}</p>}','{absenceError && <div role="alert" className="form-error"><p>{absenceError}</p><button type="button" disabled={absenceHistoryLoading} onClick={() => setAttendanceRevision(value => value + 1)}>إعادة المحاولة</button></div>}\n        {!canManageAttendance && <p className="readonly-note">تسجيل غياب العمالة والخصم المالي من صلاحيات المالك أو مشرف النظام فقط</p>}\n        {canManageAttendance && contract.status !== "active" && <p className="readonly-note">لا يمكن تسجيل الغياب إلا على عقد نشط</p>}\n        {canManageAttendance && !absenceHistoryLoading && !absenceError && !canRecordAbsence && <p role="alert" className="readonly-note">غير مصرح</p>}')
          drawer=replace(drawer,'{isOwner && canRecordAbsence && !absenceHistoryLoading && !absenceError && contract.status === "active" && (\n          <section className="drawer-section contract-absence-panel">','{canManageAttendance && (\n          <fieldset className="drawer-section contract-absence-panel" disabled={!canRecordAbsence || absenceHistoryLoading || Boolean(absenceError) || contract.status !== "active" || Boolean(busy)} aria-busy={absenceHistoryLoading}>')
          drawer=replace(drawer,'          </section>\n        )}\n        <section className="drawer-section contract-absence-history">','          </fieldset>\n        )}\n        <section className="drawer-section contract-absence-history">')
          drawer=replace(drawer,'                    setAbsenceWorkerId("");','                    setAbsenceWorkerId("");\n                    setReplacementWorkerId("");')
          drawer=replace(drawer,'onChange={(event) => setAbsenceWorkerId(event.target.value)}','onChange={(event) => { setAbsenceWorkerId(event.target.value); setReplacementWorkerId(""); }}')
          drawer=replace(drawer,'{activeAssignments\n                    .filter((item) => String(item.contractProfessionId) === absenceProfessionId)','{assignments\n                    .filter((item) => ["active", "released"].includes(item.status) && String(item.contractProfessionId) === absenceProfessionId && item.assignedAt.slice(0, 10) <= absenceDate && (!item.releasedAt || item.releasedAt.slice(0, 10) >= absenceEndDate))')
          drawer=replace(drawer,'.filter((worker) => worker.status === "available" && String(worker.id) !== absenceWorkerId && worker.profession === professions.find((item) => String(item.id) === absenceProfessionId)?.profession)', '.filter((worker) => {\n                      const profession = professions.find(item => String(item.id) === absenceProfessionId);\n                      return profession && !worker.archivedAt && worker.status === "available" && String(worker.id) !== absenceWorkerId && worker.profession === profession.profession && worker.sponsorshipType === profession.sponsorshipType && (profession.sponsorshipType !== "other" || worker.sponsorName === profession.sponsorName);\n                    })')
          drawer=replace(drawer,'                    setAbsenceEndDate(event.target.value);','                    setAbsenceEndDate(event.target.value);\n                    setAbsenceWorkerId("");\n                    setReplacementWorkerId("");')
          drawer=replace(drawer,'onChange={(event) => setAbsenceEndDate(event.target.value)}','onChange={(event) => { setAbsenceEndDate(event.target.value); setAbsenceWorkerId(""); setReplacementWorkerId(""); }}')
          drawer=replace(drawer,'{canRecordAbsence && absence.status === "active" && (','{canManageAttendance && canRecordAbsence && !absenceHistoryLoading && !absenceError && absence.status === "active" && (')
          drawer=replace(drawer,'disabled={busy === `contract-absence-void-${absence.id}`}','disabled={Boolean(busy)}')
          marker='        </div><div hidden={workspaceTab !== "workers"}>'
          drawer=replace(drawer,marker, marker+'\n          {canManageAttendance && <button type="button" className="admin-primary" onClick={() => setWorkspaceTab("attendance")}>الغياب والاستبدال</button>}')
          path.write_text(before+'function ContractDrawer('+drawer+'\nfunction WorkerTable('+after)
          path=Path('app/api/portal/contracts/[id]/attendance/route.ts')
          assert subprocess.check_output(['git','hash-object',str(path)],text=True).strip() == '89ab80ef533ffb98b4a0b01f9fe0c5fd9e8d34ea'
          text=path.read_text()
          text=replace(text,'import { auditPortalAction } from "@/lib/audit";', 'import { auditPortalAction } from "@/lib/audit";\nimport { canManageWorkerAttendance } from "@/lib/worker-attendance-access";')
          text=replace(text,'return access.role === "admin" || access.functionalRoles.some((role) => role === "system_owner" || role === "system_admin");','return canManageWorkerAttendance(access);')
          text=replace(text,'if (!access || !(await hasPortalPermission(access, "contracts", "read")))','if (!access || (!canRecordAbsence(access) && !(await hasPortalPermission(access, "contracts", "read"))))')
          path.write_text(text)
          path=Path('app/portal/portal.css')
          path.write_text(path.read_text()+'\n/* Keep permission-gated attendance forms visible and recoverable. */\nfieldset.contract-absence-panel { min-inline-size: 0; margin-inline: 0; border: 0; }\nfieldset.contract-absence-panel:disabled { opacity: .7; }\n')
          lines=Path('db/schema.ts').read_text().splitlines()
          names=['workforceContracts','contractProfessions','contractPaymentSchedules','contractWorkerAbsences','contractWorkerAssignments','workerPayrollDeductions']
          for name in names:
              start=next(i for i,line in enumerate(lines) if line.startswith('export const '+name+' ='))
              end=next((i for i in range(start+1,len(lines)) if lines[i].startswith('export const ')),len(lines))
              print('\nSCHEMA',name, 'LINES',start+1,end)
              print('\n'.join(lines[start:end]))
          PY
      - name: Commit to review branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/worker-absence-review.yml
          git add app
          git diff --cached --check
          git commit -m 'Enable explicit owner/admin worker attendance controls with retry and safe replacement selection'
          git push origin HEAD:codex/owner-admin-worker-absence-20260921
          git rev-parse HEAD
