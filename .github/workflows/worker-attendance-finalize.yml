name: Finalize and verify worker attendance
on:
  push:
    branches: [codex/owner-admin-worker-absence-20260921]
    paths: [.github/workflows/worker-attendance-finalize.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTH_MODE: credentials
      DATABASE_URL: file:/tmp/dali-ci.db
      UPLOADS_DIR: /tmp/dali-ci-uploads
      AUTH_SECRET: ci-auth-secret-for-dali-with-more-than-32-characters
      PORTAL_ADMIN_IDENTIFIER: "1234567890"
      PORTAL_ADMIN_EMAIL: admin@example.test
      PORTAL_ADMIN_EMAILS: admin@example.test
      PORTAL_ADMIN_NAME: CI Administrator
      DALI_PLAYWRIGHT_MODULE: /tmp/dali-playwright/node_modules/playwright/index.mjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Move retry state initialization into the initiating event
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          def rep(text,old,new):
              assert text.count(old)==1,old
              return text.replace(old,new,1)
          p=Path('app/portal/PortalDashboard.tsx')
          assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip()=='d4d14db2287a5aff9bf49e99594982e9ee34e434'
          text=p.read_text()
          text=rep(text,'    setAbsenceHistoryLoading(true);\n    setAbsenceError("");\n    setCanRecordAbsence(false);\n    setPendingVoidAbsenceId(null);\n','')
          text=rep(text,'onClick={() => setAttendanceRevision(value => value + 1)}','onClick={() => { setAbsenceHistoryLoading(true); setAbsenceError(""); setCanRecordAbsence(false); setPendingVoidAbsenceId(null); setAttendanceRevision(value => value + 1); }}')
          p.write_text(text)
          p=Path('tests/browser/worker-attendance.mjs')
          assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip()=='d8fda7bd6303708b1053a22b5e21ba870eb0862f'
          text=p.read_text()
          assert text.count("assert.equal(await panel.isDisabled(),true);")==3
          text=text.replace("assert.equal(await panel.isDisabled(),true);","assert.equal(await panel.evaluate(fieldset=>fieldset.disabled),true);assert.equal(await panel.locator('select').first().isDisabled(),true);")
          p.write_text(text)
          PY
      - run: npm ci
      - run: npm run i18n:generate
      - name: Commit reviewed source changes on review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/worker-attendance-finalize.yml
          git add app lib tests
          git diff --cached --check
          git commit -m 'Keep attendance retry state event-driven and verify disabled form controls'
          git push origin HEAD:codex/owner-admin-worker-absence-20260921
          echo "TESTED_COMMIT=$(git rev-parse HEAD)"
      - name: Test-only administrator hash
        run: echo "PORTAL_ADMIN_PASSWORD_HASH=$(node scripts/hash-password.mjs 'ci-test-password-2026!')" >> "$GITHUB_ENV"
      - name: Attendance integration and authorization
        run: node --experimental-strip-types --test tests/worker-attendance-access-postgres.test.mjs
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Full production build and regressions
        run: |
          mkdir -p /tmp/dali-attendance-browser
          if ! npm test > /tmp/dali-attendance-browser/regression.log 2>&1; then
            grep -n -A 24 -B 5 'not ok\|error\|Error\|fail' /tmp/dali-attendance-browser/regression.log | tail -200
            exit 1
          fi
          tail -12 /tmp/dali-attendance-browser/regression.log
      - name: Install browser runner
        run: |
          npm install --prefix /tmp/dali-playwright playwright@1.56.1 --no-audit --no-fund
          /tmp/dali-playwright/node_modules/.bin/playwright install --with-deps chromium
      - name: Actual drawer browser scenarios
        run: node tests/browser/worker-attendance.mjs
      - name: Language browser regression
        run: node tests/browser/locale-runtime.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: attendance-final-verification
          path: |
            /tmp/dali-attendance-browser
            /tmp/dali-locale-browser
          retention-days: 7
          if-no-files-found: ignore
