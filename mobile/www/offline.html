<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#071a2b" />
    <title>نظام دالي الإداري — تعذر العرض</title>
    <style>
      *{box-sizing:border-box}html,body{min-height:100%;margin:0;background:#071a2b;color:#f8fafc;font-family:system-ui,sans-serif}main{min-height:100vh;display:grid;place-content:center;text-align:center;padding:28px}strong{color:#d5a94e;font-size:1.45rem}p{max-width:420px;line-height:1.8;color:#cbd5e1}button{justify-self:center;border:0;border-radius:12px;padding:12px 20px;background:#d5a94e;color:#071a2b;font:700 1rem system-ui;cursor:pointer}
    </style>
  </head>
  <body>
    <main>
      <strong>نظام دالي الإداري</strong>
      <p>تعذر فتح الواجهة الآمنة. تحقق من الإنترنت، ثم حدّث <b>Android System WebView</b> و<b>Google Chrome</b> من متجر Play قبل إعادة المحاولة.</p>
      <p id="detected" aria-live="polite"></p>
      <button type="button" onclick="location.href='market://details?id=com.google.android.webview'">تحديث WebView</button>
      <button type="button" onclick="location.href='https://www.dally.info/portal'">إعادة المحاولة</button>
    </main>
    <script>var match=navigator.userAgent.match(/Chrome\/(\d+)/);document.getElementById('detected').textContent=match?'إصدار WebView المكتشف: '+match[1]:'تعذر قراءة إصدار WebView على هذا الجهاز.';</script>
  </body>
</html>
