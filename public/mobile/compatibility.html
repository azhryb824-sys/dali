<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#071a2b" />
    <title>تحديث مكوّن عرض نظام دالي</title>
    <style>*{box-sizing:border-box}html,body{min-height:100%;margin:0;background:#071a2b;color:#f8fafc;font-family:Tahoma,Arial,sans-serif}main{min-height:100vh;display:grid;place-content:center;gap:14px;text-align:center;padding:28px}h1{margin:0;color:#d5a94e;font-size:1.55rem}p{max-width:460px;margin:0;line-height:1.9;color:#d7e0e7}a{justify-self:center;min-width:190px;border-radius:12px;padding:13px 20px;background:#d5a94e;color:#071a2b;text-decoration:none;font-weight:700}a.secondary{border:1px solid #d5a94e;background:transparent;color:#fff}small{color:#9fb0bb}</style>
  </head>
  <body>
    <main>
      <h1>نظام دالي الإداري</h1>
      <p>مكوّن عرض صفحات الإنترنت في هذا الجهاز أقدم من الإصدار الآمن المطلوب. حدّث <b>Android System WebView</b> و<b>Google Chrome</b> من متجر Play، ثم أغلق تطبيق دالي وافتحه مجددًا.</p>
      <a href="market://details?id=com.google.android.webview">تحديث Android System WebView</a>
      <a href="market://details?id=com.android.chrome">تحديث Google Chrome</a>
      <a class="secondary" href="/portal">إعادة الفحص</a>
      <small id="detected"></small>
    </main>
    <script>var match=navigator.userAgent.match(/Chrome\/(\d+)/);document.getElementById('detected').textContent=match?'الإصدار المكتشف: '+match[1]+' — المطلوب: 111 أو أحدث':'';</script>
  </body>
</html>
