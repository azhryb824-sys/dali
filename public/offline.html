<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#001d2d">
    <meta name="robots" content="noindex,nofollow">
    <title>نظام دالي — لا يوجد اتصال</title>
    <style>
      *{box-sizing:border-box}html,body{min-height:100%;margin:0}body{min-height:100dvh;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));background:#001d2d;color:#132c38;font-family:"Tajawal",Tahoma,Arial,sans-serif}.card{width:min(460px,100%);padding:38px 30px;border-top:5px solid #e21c25;border-radius:18px;background:#fff;text-align:center;box-shadow:0 30px 90px rgba(0,0,0,.3)}img{width:112px;height:112px;margin:0 auto 22px;border-radius:24px;display:block}small{color:#e21c25;font-weight:800}h1{margin:8px 0 12px;color:#001d2d;font-size:28px}p{margin:0;color:#667881;line-height:1.9}form{margin-top:24px}button{width:100%;min-height:48px;border:0;border-radius:9px;background:#001d2d;color:#fff;font:inherit;font-weight:800;cursor:pointer}
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/pwa/icon-192.png" alt="شعار دالي">
      <small>نظام دالي الإداري</small>
      <h1>تعذّر الاتصال بالشبكة</h1>
      <p>يلزم اتصال آمن بالإنترنت لعرض بيانات النظام. لا تُحفظ صفحات البوابة أو المستندات الحساسة للاستخدام دون اتصال.</p>
      <form action="/login" method="get"><button type="submit">إعادة المحاولة</button></form>
    </main>
  </body>
</html>
