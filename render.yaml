services:
  - type: web
    name: dali
    runtime: node
    region: frankfurt
    plan: free
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm run start:render
    healthCheckPath: /api/health/ready
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: AUTH_MODE
        value: credentials
      - key: DATABASE_URL
        sync: false
      - key: UPLOADS_DIR
        value: /tmp/dali-uploads
      - key: AUTH_SECRET
        generateValue: true
      - key: PORTAL_ADMIN_IDENTIFIER
        sync: false
      - key: PORTAL_ADMIN_EMAIL
        sync: false
      - key: PORTAL_ADMIN_EMAILS
        sync: false
      - key: PORTAL_ADMIN_NAME
        sync: false
      - key: PORTAL_ADMIN_PASSWORD_HASH
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_REPLY_TO
        sync: false
